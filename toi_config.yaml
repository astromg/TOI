toi:
  telescopes: ["wk06","zb08","jk15","wg25"]
  nats_host: 192.168.7.38
  nats_port: 4222

  mark_saturated_stars: True
  log_display_h: 8

  show_sat_stars: True

  # Flat Log window: last sky flats (evening/morning) and science per filter, published by flat_overwatch
  flat_overwatch_subject: "data.overwatch.{tel}.camera.{item}"   # {item}: last_flat_evening ... (toi_subjects FLAT_OVERWATCH_ITEMS); since 2026-11-10
  flat_fresh_h: 20        # flat younger than this -> green
  flat_old_days: 10       # flat older than this -> orange; red if the filter was used within this time and had no flats in it
  master_fresh_days:      # last master zero / dark younger than this -> green
    zeros: 0.5
    darks: 30
  master_max_days:        # up to this -> no colour (like flats); older -> red if an object was observed within this time, else orange
    zeros: 1
    darks: 60             # darks are taken when there is no weather; a second month is still fine

  # observers of the night: the entry is valid until the next reset, every day at this hour UT (15 UT = noon in
  # Chilean summer, 11 in winter); after it the observers window pops up again
  observers_reset_ut: 15

  # Aux "Telescope" tab: <url>/telescope_<tel>/ of the OCA manual on the intranet
  oca_manual_url: http://docker.oca.lan:8081

  # Aux "Tasks" tab, right: observation requests of ocm-plans (GitHub issues, index rebuilt by an Action, on NFS)
  requests_json: /data/misc/ocm-plans/requests.json

  # alive RPC subjects of services outside ocabox-tcs (top row of the obs window), reply {"status": "ok"};
  # empty: the lamp stays grey
  alive_subjects:
    flat_overwatch: rpc.overwatch.oca.flat_overwatch.alive
    conditions_overwatch: rpc.overwatch.oca.conditions_overwatch.alive    # was weather_overwatch until 2026-11-10
    allsky_overwatch: rpc.overwatch.oca.allsky_overwatch.alive

  # site seeing / photometric zero point from conditions_overwatch, sky state from allsky_overwatch (obs window fields);
  # missing: the field stays "--"
  conditions_subjects:
    seeing: status.overwatch.oca.self.seeing          # NATS RFC since 2026-11-10 (was tic.status.ocm.weather_overwatch.*,
    zero_point: status.overwatch.oca.self.zero_point  # tic.status.ocm.allsky_overwatch.clouds)
    clouds: data.overwatch.oca.allsky.clouds
    # weather restrictions (official levels with the hold time): a dot with minutes next to Wind / Direction /
    # Humidity / Temp / Clouds while a restriction is still held although the current value is better
    weather_level: status.overwatch.oca.self.weather_level

  # conditions_overwatch (2026-11-10): events (Aux tab Events, events_gui.py) and alerts to acknowledge (pop-up window);
  # sounds / pictures to choose from - the same folders the overwatch and the oca_monitor that plays the sounds see
  events:
    list: status.overwatch.oca.self.events
    alerts: status.overwatch.oca.self.alerts
    rpc: rpc.overwatch.oca.conditions_overwatch.events
    sounds_dir: /data/misc/oca_overwatch/sounds
    pictures_dir: /data/misc/oca_overwatch/pictures


wk06:
  tel_directory: /data/fits/wk06/
  tel_ob_list: /data/misc/synced/objects_list/
  flat_log_files: /Logs/wk06_flats_log.txt
  object_catalog: ./object_catalog.txt

  light_ip: 192.168.7.217
  overhead: 15
  showRotator: False
  focus_step: 30          # default Step in the Aux Focus tab (overrides TIC's focuser.default_step)
  focus_method: laplacian # default method: Focus tab and plan FOCUS OBs
  focus_methods: [laplacian, lorentzian, rms_quad, rms, fwhm]   # pyaraucaria.focus names; TIC's focusing_methods has 'ffs_fwhm', unknown there

zb08:
  tel_directory: /data/fits/zb08/
  tel_ob_list: /data/misc/synced/objects_list/
  flat_log_files: /Logs/zb08_flats_log.txt
