toi:
  telescopes: ["wk06","zb08","jk15"]
  nats_host: 192.168.7.38
  nats_port: 4222

  mark_saturated_stars: True
  log_display_h: 8

  show_sat_stars: True

  # Flat Log window: last sky flats (evening/morning) and science per filter, published by flat_overwatch
  flat_overwatch_subject: "tic.status.{tel}.flat_overwatch.{item}"   # after the NATS RFC: "data.overwatch.{tel}.camera.{item}"
  flat_fresh_h: 20        # flat younger than this -> green
  flat_old_days: 10       # flat older than this -> orange; red if the filter was used within this time and had no flats in it
  master_fresh_days:      # last master zero / dark younger than this -> green
    zeros: 0.5
    darks: 30
  master_max_days:        # up to this -> grey; older -> red if an object was observed within this time, else orange
    zeros: 1
    darks: 60             # darks are taken when there is no weather; a second month is still fine

  # observers of the night: the entry is valid until the next reset, every day at this hour UT (15 UT = noon in
  # Chilean summer, 11 in winter); after it the observers window pops up again
  observers_reset_ut: 15

  # Aux "Telescope" tab: <url>/telescope_<tel>/ of the OCA manual on the intranet
  oca_manual_url: http://docker.oca.lan:8081

  # alive RPC subjects of services outside ocabox-tcs (top row of the obs window), reply {"status": "ok"};
  # empty: the lamp stays grey
  alive_subjects:
    flat_overwatch: rpc.overwatch.oca.flat_overwatch.alive
    weather_overwatch: rpc.overwatch.oca.weather_overwatch.alive

  # site seeing / photometric zero point from weather_overwatch (obs window fields); missing: the field stays "--"
  conditions_subjects:
    seeing: tic.status.ocm.weather_overwatch.seeing
    zero_point: tic.status.ocm.weather_overwatch.zero_point


wk06:
  tel_directory: /data/fits/wk06/
  tel_ob_list: /data/misc/synced/objects_list/
  flat_log_files: /Logs/wk06_flats_log.txt
  object_catalog: ./object_catalog.txt

  light_ip: 192.168.7.217
  overhead: 15
  showRotator: False
  focus_step: 30          # default Step in the Aux Focus tab (overrides TIC's focuser.default_step)
  focus_method: laplacian # default method: Focus tab and plan FOCUS OBs
  focus_methods: [laplacian, lorentzian, rms_quad, rms, fwhm]   # pyaraucaria.focus names; TIC's focusing_methods has 'ffs_fwhm', unknown there

